<!DOCTYPE html>

 <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1d2671, #c33764);
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}
.container {
    text-align: center;
    padding: 30px 20px;
}
h1 {
    font-size: 42px;
    margin-bottom: 25px;
    letter-spacing: 2px;
}
game {
    width: 330px;
    height: 330px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: 10px;

    margin: 0 auto 30px;
}
.box {
    width: 100%;
    height: 100%;

    border: none;
    border-radius: 12px;

    background-color: #ffffff;

    color: #1d2671;

    font-size: 55px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);

    transition: 0.2s ease;
}
.box:hover {
    transform: scale(1.03);
    background-color: #f1f1f1;
}
.box:disabled {
    cursor: not-allowed;
}
button {
    font-family: inherit;
}
#new-btn,
#reset-btn {
    border: none;

    padding: 12px 25px;

    margin: 8px;

    border-radius: 8px;

    background-color: #222;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s ease;
}
#new-btn:hover,
#reset-btn:hover {
    background-color: #444;
    transform: translateY(-2px);
}
.msg-container {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.75);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 25px;

    z-index: 100;
}
#msg {
    font-size: 35px;
    font-weight: bold;

    text-align: center;

    color: white;
}

.hide {
    display: none;
}
@media (max-width: 500px) {

    .container {
        padding: 20px 15px;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 20px;
    }

    .game {
        width: 290px;
        height: 290px;
        gap: 8px;
    }

    .box {
        font-size: 45px;
        border-radius: 10px;
    }

    #msg {
        font-size: 26px;
        padding: 0 20px;
    }

    #new-btn,
    #reset-btn {
        padding: 10px 20px;
        font-size: 15px;
    }
}
@media (max-width: 350px) {

    .game {
        width: 250px;
        height: 250px;
    }

    .box {
        font-size: 38px;
    }

    h1 {
        font-size: 28px;
    }
}

<body>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="new-btn">New Game</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="reset-btn">Reset Game</button>
    </main>
    <script>
       let boxes = document.querySelectorAll(".box");
let resetBtn = document.querySelector("#reset-btn");
let newGameBtn = document.querySelector("#new-btn");
let msgContainer = document.querySelector(".msg-container");
let msg = document.querySelector("#msg");

let turnO = true; //playerX, playerO
let count = 0; //To Track Draw

const winPatterns = [
  [0, 1, 2],
  [0, 3, 6],
  [0, 4, 8],
  [1, 4, 7],
  [2, 5, 8],
  [2, 4, 6],
  [3, 4, 5],
  [6, 7, 8],
];

const resetGame = () => {
  turnO = true;
  count = 0;
  enableBoxes();
  msgContainer.classList.add("hide");
};

boxes.forEach((box) => {
  box.addEventListener("click", () => {
    if (turnO) {
      //playerO
      box.innerText = "O";
      turnO = false;
    } else {
      //playerX
      box.innerText = "X";
      turnO = true;
    }
    box.disabled = true;
    count++;

    let isWinner = checkWinner();

    if (count === 9 && !isWinner) {
      gameDraw();
    }
  });
});

const gameDraw = () => {
  msg.innerText = "Game is a Draw";
  msgContainer.classList.remove("hide");
  disableBoxes();
};

const disableBoxes = () => {
  for (let box of boxes) {
    box.disabled = true;
  }
};

const enableBoxes = () => {
  for (let box of boxes) {
    box.disabled = false;
    box.innerText = "";
  }
};

const showWinner = (winner) => {
  msg.innerText = `Congratulations, Winner is ${winner}`;
  msgContainer.classList.remove("hide");
  disableBoxes();
};
const checkWinner = ( ) => {
    for (let pattern of winPatterns) {
      let pos1Val = boxes[pattern[0]].innerText;
      let pos2Val = boxes[pattern[1]].innerText;
      let pos3Val = boxes[pattern[2]].innerText;
  
      if (pos1Val != "" && pos2Val != "" && pos3Val != "") {
        if (pos1Val === pos2Val && pos2Val === pos3Val) {
          showWinner(pos1Val);
          return true;
        }
      }
    }
  };
  
  newGameBtn.addEventListener("click", resetGame);
  resetBtn.addEventListener("click", resetGame);
    </script>
